[project]
name = "ilpusht"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "lerobot[pusht,diffusion,training,viz]==0.6.1",
  "mlflow==3.17.0",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "prometheus_client==0.26.0",
  "pytest==9.1.1",
  "PyYAML==6.0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
